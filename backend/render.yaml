services:
  - type: web
    name: excel-travel-fuel-api
    runtime: node
    plan: free
    buildCommand: npm install
    startCommand: npm start
    autoDeploy: true
    disk:
      name: fuel-data
      mountPath: /data
      sizeGB: 1
    envVars:
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: ADMIN_EMAIL
        value: admin@exceltravel.rw
      - key: ADMIN_PASSWORD
        sync: false
      - key: DB_PATH
        value: /data/fuel.db
      - key: CORS_ORIGIN
        sync: false
      - key: NODE_VERSION
        value: 20.11.1
