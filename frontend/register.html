<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Create Account — Excel Travel & Tours</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
    :root {
      --blue: #2563EB; --blue-dark: #1D4ED8; --blue-light: #EFF6FF;
      --green: #16A34A; --green-light: #F0FDF4;
      --red: #DC2626; --red-light: #FEF2F2;
      --gray-50: #F9FAFB; --gray-100: #F3F4F6; --gray-200: #E5E7EB;
      --gray-300: #D1D5DB; --gray-400: #9CA3AF; --gray-500: #6B7280;
      --gray-700: #374151; --gray-800: #1F2937; --gray-900: #111827;
    }
    body {
      font-family: 'Inter', -apple-system, sans-serif;
      background: var(--gray-50);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 20px;
      -webkit-font-smoothing: antialiased;
    }
    .brand {
      display: flex; align-items: center; gap: 12px; margin-bottom: 28px;
    }
    .brand-logo {
      width: 44px; height: 44px; background: var(--blue); border-radius: 10px;
      color: white; font-size: 15px; font-weight: 700;
      display: flex; align-items: center; justify-content: center;
    }
    .brand-name { font-size: 16px; font-weight: 700; color: var(--gray-900); }
    .brand-sub  { font-size: 12px; color: var(--gray-500); }
    .card {
      width: 100%; max-width: 420px;
      background: white; border: 1px solid var(--gray-200);
      border-radius: 16px; padding: 32px;
      box-shadow: 0 4px 24px rgba(0,0,0,0.07);
    }
    .card-title { font-size: 20px; font-weight: 700; color: var(--gray-900); margin-bottom: 6px; }
    .card-sub   { font-size: 14px; color: var(--gray-500); margin-bottom: 24px; }
    .field { display: flex; flex-direction: column; gap: 5px; margin-bottom: 16px; }
    .field label { font-size: 13px; font-weight: 500; color: var(--gray-700); }
    .field input {
      padding: 10px 12px; border: 1px solid var(--gray-300);
      border-radius: 8px; font-size: 15px; font-family: inherit;
      color: var(--gray-900); background: white;
      transition: border-color 0.15s, box-shadow 0.15s;
    }
    .field input:focus {
      outline: none; border-color: var(--blue);
      box-shadow: 0 0 0 3px rgba(37,99,235,0.1);
    }
    .field input.error { border-color: var(--red); }
    .field .hint { font-size: 11px; color: var(--gray-400); }
    .btn {
      width: 100%; padding: 11px; border-radius: 8px;
      font-size: 15px; font-weight: 600; font-family: inherit;
      cursor: pointer; border: none;
      transition: background 0.15s, transform 0.1s; margin-top: 4px;
    }
    .btn-primary { background: var(--blue); color: white; }
    .btn-primary:hover { background: var(--blue-dark); }
    .btn-primary:active { transform: scale(0.99); }
    .alert {
      padding: 12px 14px; border-radius: 8px;
      font-size: 13px; font-weight: 500; margin-bottom: 16px; display: none;
    }
    .alert.show { display: flex; align-items: center; gap: 8px; }
    .alert-error   { background: var(--red-light); color: var(--red); border: 1px solid #FECACA; }
    .alert-success { background: var(--green-light); color: var(--green); border: 1px solid #BBF7D0; }
    .login-prompt {
      text-align: center; font-size: 13px; color: var(--gray-500); margin-top: 20px;
    }
    .login-prompt a { color: var(--blue); font-weight: 600; text-decoration: none; }
    .login-prompt a:hover { text-decoration: underline; }
    .pw-strength { display: flex; gap: 4px; margin-top: 6px; }
    .pw-bar { flex: 1; height: 3px; border-radius: 99px; background: var(--gray-200); transition: background 0.2s; }
    .pw-bar.weak   { background: var(--red); }
    .pw-bar.medium { background: #F59E0B; }
    .pw-bar.strong { background: var(--green); }
  </style>
</head>
<body>

  <div class="brand">
    <div class="brand-logo">ET</div>
    <div>
      <div class="brand-name">Excel Travel & Tours</div>
      <div class="brand-sub">Fuel Management System</div>
    </div>
  </div>

  <div class="card">
    <div class="card-title">Create your account</div>
    <div class="card-sub">Each email address can only be registered once</div>

    <div class="alert alert-error" id="regError">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="12" cy="12" r="10"/><line x1="12" y1="8" x2="12" y2="12"/><line x1="12" y1="16" x2="12.01" y2="16"/></svg>
      <span id="regErrorMsg"></span>
    </div>
    <div class="alert alert-success" id="regSuccess">
      <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5"><polyline points="20 6 9 17 4 12"/></svg>
      <span>Account created! Redirecting to sign in...</span>
    </div>

    <div class="field">
      <label for="regName">Full name</label>
      <input type="text" id="regName" placeholder="Your full name" autocomplete="name" />
    </div>
    <div class="field">
      <label for="regEmail">Email address</label>
      <input type="email" id="regEmail" placeholder="you@exceltravel.rw" autocomplete="email" />
    </div>
    <div class="field">
      <label for="regPassword">Password</label>
      <input type="password" id="regPassword" placeholder="At least 8 characters" oninput="checkStrength(this.value)" />
      <div class="pw-strength">
        <div class="pw-bar" id="bar1"></div>
        <div class="pw-bar" id="bar2"></div>
        <div class="pw-bar" id="bar3"></div>
      </div>
      <span class="hint">Use a mix of letters, numbers, and symbols</span>
    </div>
    <div class="field">
      <label for="regConfirm">Confirm password</label>
      <input type="password" id="regConfirm" placeholder="Repeat your password" />
    </div>

    <button class="btn btn-primary" onclick="handleRegister()">Create account</button>

    <div class="login-prompt">
      Already have an account? <a href="login.html">Sign in</a>
    </div>
  </div>

  <script src="js/config.js"></script>
  <script src="js/auth.js"></script>
  <script>
    // Redirect if already logged in
    const sess = Auth.getSession();
    if (sess && Auth.getToken()) window.location.href = sess.role === 'admin' ? 'pages/admin-dashboard.html' : 'index.html';

    function checkStrength(pw) {
      const bars = [document.getElementById('bar1'), document.getElementById('bar2'), document.getElementById('bar3')];
      bars.forEach(b => b.className = 'pw-bar');
      if (!pw) return;
      let score = 0;
      if (pw.length >= 8) score++;
      if (/[A-Z]/.test(pw) && /[a-z]/.test(pw)) score++;
      if (/[0-9]/.test(pw) || /[^A-Za-z0-9]/.test(pw)) score++;
      const cls = score === 1 ? 'weak' : score === 2 ? 'medium' : 'strong';
      for (let i = 0; i < score; i++) bars[i].classList.add(cls);
    }

    function setError(msg) {
      document.getElementById('regErrorMsg').textContent = msg;
      document.getElementById('regError').classList.add('show');
    }
    function clearError() { document.getElementById('regError').classList.remove('show'); }

    async function handleRegister() {
      clearError();
      const name     = document.getElementById('regName').value.trim();
      const email    = document.getElementById('regEmail').value.trim();
      const password = document.getElementById('regPassword').value;
      const confirm  = document.getElementById('regConfirm').value;

      if (!name || !email || !password || !confirm) { setError('All fields are required.'); return; }
      if (password.length < 8) { setError('Password must be at least 8 characters.'); return; }
      if (password !== confirm) { setError('Passwords do not match.'); return; }

      const submitBtn = document.querySelector('.btn-primary');
      submitBtn.disabled = true;
      submitBtn.textContent = 'Creating account...';

      const result = await Auth.register({ name, email, password });

      submitBtn.disabled = false;
      submitBtn.textContent = 'Create account';

      if (!result.ok) { setError(result.error); return; }

      document.getElementById('regSuccess').classList.add('show');
      setTimeout(() => { window.location.href = 'login.html'; }, 2000);
    }

    document.addEventListener('keydown', e => { if (e.key === 'Enter') handleRegister(); });
  </script>
</body>
</html>
